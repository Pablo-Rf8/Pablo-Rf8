name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/refresh-profile-cards.mjs
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Refresh cards and preserve the last valid SVGs
        run: node scripts/refresh-profile-cards.mjs

      - name: Publish updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already current."
            exit 0
          fi
          git commit -m "chore: refresh public profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
